# The rule set is listed explicitly rather than inherited from ruff's defaults, which
# change between releases. That half of the problem is solved here; the other half is the
# ruff version itself, pinned in requirements.txt. Both are needed - an explicit rule set
# under a floating ruff still reddens a green pipeline the day a rule is added to one of
# the selected families.
line-length = 95
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "PERF", "RUF", "SIM", "C4"]

[lint.per-file-ignores]
# The module lives beside its tests rather than in a package, so sys.path is adjusted
# before the import. That is the reason for the import placement, not an oversight.
"tests/*" = ["E402"]
